[project]
name = "telegram-issue-bot"
version = "0.1.0"
description = "Telegram bot for team issue reporting and tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "telegram-issue-management contributors" }]
keywords = ["telegram", "bot", "issues", "team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
issuebot = "issuebot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
